syntax = "proto3";

package storage;

option java_multiple_files = true;
option java_package = "com.memap.grpc.storage";
option java_outer_classname = "FileLookupProto";

service FileLookupService {
  rpc GetFileInfo(GetFileInfoRequest) returns (GetFileInfoResponse);
  rpc GetFileInfos(GetFileInfosRequest) returns (GetFileInfosResponse);
}

message GetFileInfoRequest {
  string file_id = 1;
}

message GetFileInfoResponse {
  string file_id = 1;
  string name = 2;
  string original_name = 3;
  string content_type = 4;
  int64 size = 5;
  string download_url = 6;
  string created_at = 7;
  bool found = 8;
}

message GetFileInfosRequest {
  repeated string file_ids = 1;
}

message FileInfoData {
  string file_id = 1;
  string name = 2;
  string original_name = 3;
  string content_type = 4;
  int64 size = 5;
  string download_url = 6;
  string created_at = 7;
}

message GetFileInfosResponse {
  map<string, FileInfoData> files = 1;
}
