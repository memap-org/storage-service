spring:
  application:
    name: storage-service
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:8095}
        instance:
          service-url: ${STORAGE_SERVICE_URL:http://localhost:8088/storage}
          name: storage-service
  data:
    mongodb:
      uri: ${STORAGE_MONGO_URI:mongodb://localhost:27017/storage_service}
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

server:
  port: 8088
  servlet:
    context-path: /storage

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

open:
  api:
    title: Storage service
    version: 1.0.0
    description: Storage service API
    serverUrl: ${GATEWAY_URL:http://localhost:8090}/storage
    serverName: storage service

app:
  storage:
    internal-api-key: ${STORAGE_INTERNAL_API_KEY:changeme-local-dev-only}
    backend: minio
    download-url-prefix: ${STORAGE_BASE_URL:http://localhost:${server.port}${server.servlet.context-path}}
    local:
      base-dir: /data/storage/files
    minio:
      endpoint: ${STORAGE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${STORAGE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${STORAGE_MINIO_SECRET_KEY:minioadmin}
      bucket-name: ${STORAGE_MINIO_BUCKET:memap-files}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always

grpc:
  server:
    port: ${STORAGE_GRPC_PORT:9088}
    security:
      enabled: false
  client:
    roadmap-service:
      address: ${ROADMAP_GRPC_ADDRESS:static://localhost:9083}
      negotiationType: PLAINTEXT
      deadline: ${ROADMAP_GRPC_DEADLINE_MS:5000}
